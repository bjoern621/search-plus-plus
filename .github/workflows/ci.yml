name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The runner tests spawn ripgrep, which VS Code ships to the extension.
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run sbom:check
      - run: xvfb-run -a npm run test:integration
